name: DFTHC-SOS angle-tree proxy

on:
  push:
    branches:
      - research/dfthcsos-angle-tree-proxy
    paths:
      - experiments/dfthcsos-angle-tree/**
      - .github/workflows/dfthcsos-angle-tree-proxy.yml
      - google-verifiable-quantum-circuit-compilation/sample_submission/dfthcsos/submission.npz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run classical tree screen
        run: |
          python experiments/dfthcsos-angle-tree/tree_proxy.py \
            --source-brot 12 \
            --target-brot 8 \
            --top-k 12 \
            --out /tmp/dfthcsos-angle-tree
      - uses: actions/upload-artifact@v4
        with:
          name: dfthcsos-angle-tree-screen
          path: /tmp/dfthcsos-angle-tree/
          if-no-files-found: error
          retention-days: 7
