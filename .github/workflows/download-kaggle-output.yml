name: Download existing BM Kaggle outputs

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/download-kaggle-output.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-existing-output:
    runs-on: ubuntu-latest
    environment: KAGGLE_API_TOKEN
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: varistebernhard/rs-bm-reproduction

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip kaggle
          kaggle --version

      - name: Check existing Kaggle kernel status
        shell: bash
        run: |
          set +e
          kaggle kernels status "$KERNEL_ID" 2>&1 | tee kernel-status.txt
          status_rc=${PIPESTATUS[0]}
          echo "kaggle_status_exit_code=$status_rc" >> kernel-status.txt
          exit 0

      - name: Download existing outputs (do not rerun kernel)
        id: download
        shell: bash
        run: |
          mkdir -p kaggle-output
          set +e
          timeout 300s kaggle kernels output "$KERNEL_ID" -p kaggle-output -o 2>&1 | tee kaggle-output/download.log
          rc=${PIPESTATUS[0]}
          set -e
          if (( rc != 0 )); then
            echo "Could not download the existing Kaggle output (exit $rc). This workflow does not push or rerun the kernel." > kaggle-output/OUTPUT_DOWNLOAD_FAILED.txt
            exit 1
          fi
          if ! find kaggle-output -type f ! -name 'download.log' -print -quit | grep -q .; then
            echo "Kaggle CLI completed but returned no result files. This workflow did not rerun the kernel." > kaggle-output/NO_OUTPUT_FILES.txt
          fi

      - name: Record retrieval metadata
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          mkdir -p kaggle-output
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = {
              "kernel_id": os.environ["KERNEL_ID"],
              "operation": "download_existing_outputs_only",
              "github_run_id": os.environ["RUN_ID"],
              "github_sha": os.environ["RUN_SHA"],
              "job_status": os.environ["JOB_STATUS"],
          }
          Path("kaggle-output/retrieval-metadata.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
          if [ -f kernel-status.txt ]; then cp kernel-status.txt kaggle-output/kernel-status.txt; fi

      - name: Upload existing outputs or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs-bm-existing-kaggle-outputs
          path: kaggle-output/
          if-no-files-found: warn
          retention-days: 30
