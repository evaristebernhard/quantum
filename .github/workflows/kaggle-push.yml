name: Push BM reproduction to Kaggle

on:
  push:
    branches:
      - master
      - main
    paths:
      - "experiments/dqi-reed-solomon-bm/**"
      - ".github/workflows/kaggle-push.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-and-run-kaggle:
    runs-on: ubuntu-latest
    # GitHub Environment name; it contains the KAGGLE_API_TOKEN secret.
    environment: KAGGLE_API_TOKEN
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_ID: varistebernhard/rs-bm-reproduction
      KERNEL_DIR: experiments/dqi-reed-solomon-bm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip kaggle
          kaggle --version

      - name: Validate token and kernel metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "::error::KAGGLE_API_TOKEN is empty. Check the KAGGLE_API_TOKEN Environment and its secret."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("experiments/dqi-reed-solomon-bm")
          metadata = json.loads((folder / "kernel-metadata.json").read_text())
          expected = {
              "id": "varistebernhard/rs-bm-reproduction",
              "code_file": "main.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": "true",
              "enable_gpu": "false",
              "enable_internet": "true",
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"Invalid kernel metadata: {key}={metadata.get(key)!r}, expected {value!r}")
          if "machine_shape" in metadata:
              raise SystemExit("CPU-only kernel metadata must not set machine_shape.")
          if not (folder / metadata["code_file"]).is_file():
              raise SystemExit("Notebook file referenced by code_file is missing.")
          print("CPU-only kernel metadata validated.")
          PY

      - name: Push notebook and start Kaggle run
        id: push-kaggle
        run: |
          set -euo pipefail
          kaggle kernels push -p "$KERNEL_DIR"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for Kaggle execution
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            set +e
            status="$(kaggle kernels status "$KERNEL_ID" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$status"
            if (( rc != 0 )); then
              echo "::error::Unable to read Kaggle kernel status."
              exit "$rc"
            fi
            if grep -Eiq 'KernelWorkerStatus\.COMPLETE|status[^[:alnum:]]*complete|completed successfully' <<<"$status"; then
              echo "Kaggle run completed."
              exit 0
            fi
            if grep -Eiq 'KernelWorkerStatus\.(ERROR|CANCELLED)|status[^[:alnum:]]*(error|failed|cancelled)' <<<"$status"; then
              echo "::error::Kaggle kernel ended unsuccessfully."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for the Kaggle kernel after 60 minutes."
          exit 1

      # Run even if the Kaggle notebook failed, so partial logs/results can still be recovered.
      - name: Download Kaggle outputs
        if: always() && steps.push-kaggle.outputs.pushed == 'true'
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p kaggle-output
          # Bound this call so the metadata and artifact steps still execute if Kaggle stalls.
          timeout 300s kaggle kernels output "$KERNEL_ID" -p kaggle-output -o
          rc=$?
          if (( rc != 0 )); then
            echo "Kaggle output download failed or timed out (exit $rc). Check the job log and Kaggle kernel page." > kaggle-output/OUTPUT_DOWNLOAD_FAILED.txt
            exit 1
          fi
          if ! find kaggle-output -type f -print -quit | grep -q .; then
            echo "The Kaggle output command returned no files." > kaggle-output/NO_OUTPUT_FILES.txt
          fi
      - name: Record workflow metadata
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          mkdir -p kaggle-output
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "kernel_id": os.environ["KERNEL_ID"],
              "job_status": os.environ.get("JOB_STATUS"),
              "github_run_id": os.environ.get("GITHUB_RUN_ID_VALUE"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT_VALUE"),
              "github_sha": os.environ.get("GITHUB_SHA_VALUE"),
              "github_ref": os.environ.get("GITHUB_REF_VALUE"),
          }
          Path("kaggle-output/workflow-metadata.json").write_text(
              json.dumps(data, indent=2) + "\n"
          )
          PY

      - name: Upload reproduction data as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs-bm-reproduction-results
          path: kaggle-output/
          if-no-files-found: warn
          retention-days: 30
